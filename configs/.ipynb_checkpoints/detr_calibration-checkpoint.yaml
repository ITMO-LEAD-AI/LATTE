model:
  name: facebook/detr-resnet-50
  calibration_processor: PekingU/rtdetr_r50vd

dataset:
  images: /home/tnn/CVPR_2025/datasets/coco/images/train2017
  annotations: /home/tnn/CVPR_2025/datasets/coco/annotations/instances_train2017.json
  num_samples: 5000

calibration:
  collection_batch_size: 32
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  chunk_size: 2
  cosine_weight: 1.0
  mse_weight: 1.0
  trainable_parameters: all
  seed: 42
  device: cuda

linearization:
  layers: all

output:
  checkpoint_path: checkpoints/detr_resnet50_latte.pth
